<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maharaja's Spices</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        h1 {
            color: #d32f2f;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            max-width: 280px;
            line-height: 1.5;
        }
        .retry-button {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
            transition: all 0.3s ease;
        }
        .retry-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(211, 47, 47, 0.3);
        }
        .loading-dots {
            display: none;
            margin-top: 20px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #d32f2f;
            border-radius: 50%;
            display: inline-block;
            margin: 0 4px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>
    <img src="icon.png" class="logo" alt="Logo">
    <h1>Connection Lost</h1>
    <p>Please check your internet connection and try again.</p>
    <button class="retry-button" onclick="retry()">Retry Connection</button>
    <div id="loading" class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <script>
        function retry() {
            document.getElementById('loading').style.display = 'block';
            document.querySelector('.retry-button').style.display = 'none';
            // The native code will catch this and attempt to reload the live site
            window.location.reload();
        }
    </script>
</body>
</html>
